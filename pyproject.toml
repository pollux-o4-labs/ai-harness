[project]
name = "ai-harness"
version = "0.2.0"
description = "레포 공용 pre-commit·PR 문서 게이트 (stdlib only)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-harness = "ai_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_harness"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# 명백한 오류만 잡도록 의도적으로 좁힌 큐레이션(E4·E7·E9·F)이다 — ruff 무설정
# 기본과 "동일"이 아니라(0.16 기본은 SIM 등으로 더 넓다) 이 넷에 고정한 것.
# 그러므로 이 select는 지워도 되는 중복이 아니다(지우면 기본을 따라 넓어진다).
# 대량 리포맷 금지 원칙에 맞춰 의도된 스타일과 충돌하는 규칙은 켜지 않는다:
# - E501(줄 길이) 미선택: BLUF 단일줄 주석 규범(한국어/CJK를 ruff가 2배 폭으로
#   계산)이 어떤 합리적 코드 폭도 넘어서므로 의도된 규범을 존중.
# - I(isort) 미선택: 테스트가 경로를 세운 뒤 import하는 수기 배치(`# noqa: E402`)와
#   단일줄 import를 재배열해 의도된 레이아웃을 훼손하므로.
# - E731(lambda 대입)은 국소 1곳뿐이라 전역 ignore 대신 그 줄에 인라인 noqa로 둔다
#   (이 레포 관례 = 국소 예외는 라인 단위로 가시화, `noqa: E402`와 동형).
select = ["E4", "E7", "E9", "F"]
